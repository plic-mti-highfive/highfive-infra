services:
  # 1. NGINX GATEWAY
  gateway:
    image: nginx:alpine
    container_name: highfive_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-52}:52"
      #- "443:443"
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      frontend:
        condition: service_started
      backend_core:
        condition: service_started
      backend_canvas:
        condition: service_started
      backend_ai_api:
        condition: service_healthy

  # 2. FRONTEND
  frontend:
    image: ghcr.io/plic-mti-highfive/highfive-frontend:${FRONTEND_VERSION:-latest}
    container_name: highfive_frontend
    restart: unless-stopped

  # 3. CORE BACKEND
  backend_core:
    image: ghcr.io/plic-mti-highfive/highfive-backend-core:${CORE_VERSION:-latest}
    container_name: highfive_backend_core
    restart: unless-stopped
    environment:
      # App
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Database (PostgreSQL)
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgresadmin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgresadmin}
      DB_DATABASE: highfive
      # Sessions (jetons opaques : la v2 n'utilise plus de JWT ici)
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-change-me-pepper}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Redis (files BullMQ vers le service IA)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Stockage objet. L'endpoint public sert les URL presignees rendues au
      # navigateur : il doit etre joignable depuis l'hote, pas depuis le reseau
      # Docker.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_HOST_PORT:-9000}
      MINIO_REGION: ${MINIO_REGION:-eu-west-3}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${CORE_BUCKET:-highfive-core-bucket}
      # Service canvas. CANVAS_JWT_SECRET et CANVAS_INTERNAL_SECRET doivent
      # valoir exactement le JWT_SECRET et l'INTERNAL_SECRET du service canvas.
      # CANVAS_WS_URL est rendue au navigateur : elle passe par la gateway.
      CANVAS_URL: http://backend_canvas:8585
      CANVAS_WS_URL: ws://localhost:${GATEWAY_PORT:-52}/ws
      CANVAS_JWT_SECRET: ${CANVAS_JWT_SECRET:-change-me-canvas}
      CANVAS_INTERNAL_SECRET: ${CANVAS_INTERNAL_SECRET:-dev-internal-secret}
      CANVAS_TOKEN_EXPIRATION: 1h
      # Service IA (vide desactive les recommandations)
      AI_URL: http://backend_ai_api:8000
      AI_TENANT_ID: ${AI_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      # Doit valoir exactement le JWT_SECRET du service IA.
      AI_JWT_SECRET: ${JWT_SECRET:-clee-super-secret}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      # Generation de taches a partir du Mur
      OPENAI_TOKEN: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Sert de signal au job seed (et a toute dependance future) : le
    # conteneur peut etre "started" avant que Nest n'ecoute vraiment.
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health/ready']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 4. CANVAS BACKEND
  backend_canvas:
    image: ghcr.io/plic-mti-highfive/highfive-backend-canvas:${CANVAS_VERSION:-latest}
    container_name: highfive_backend_canvas
    restart: unless-stopped
    environment:
      ENV: dev
      SERVER_NAME: hocuspocus-server
      PORT: 8585
      # s3Config (src/index.ts) ne fixe pas de region : le SDK AWS la lit ici.
      AWS_REGION: ${MINIO_REGION:-eu-west-3}
      # Stockage du document Yjs
      BUCKET_NAME: ${CANVAS_BUCKET:-hocuspocus-bucket-dev}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USERNAME: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Doivent correspondre aux CANVAS_* du core : c'est lui qui signe les
      # tokens canvas, ce service les verifie.
      JWT_SECRET: ${CANVAS_JWT_SECRET:-change-me-canvas}
      INTERNAL_SECRET: ${CANVAS_INTERNAL_SECRET:-dev-internal-secret}
      # Queue des evenements canvas (chat)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. AI BACKEND
  # Les migrations Alembic du service IA ne sont jouees par personne au
  # demarrage : sans ce service a usage unique, la table `embeddings` n'existe
  # pas et tout le matchmaking repond 500.
  backend_ai_migrate:
    image: ghcr.io/plic-mti-highfive/highfive-backend-ai-api:${AI_VERSION:-latest}
    container_name: highfive_backend_ai_migrate
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URI : postgresql+asyncpg://${POSTGRES_USER:-postgresadmin}:${POSTGRES_PASSWORD:-postgresadmin}@db:5432/highfive
      JWT_SECRET : ${JWT_SECRET:-clee-super-secret}
      OPENAI_API_KEY : ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  backend_ai_api:
    image: ghcr.io/plic-mti-highfive/highfive-backend-ai-api:${AI_VERSION:-latest}
    container_name: highfive_backend_ai_api
    restart: unless-stopped
    environment:
      DATABASE_URI : postgresql+asyncpg://${POSTGRES_USER:-postgresadmin}:${POSTGRES_PASSWORD:-postgresadmin}@db:5432/highfive
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET : ${JWT_SECRET:-clee-super-secret}
      OPENAI_API_KEY : ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_ai_migrate:
        condition: service_completed_successfully
    # Sans cela, `up --wait` ne fait qu'attendre le demarrage du conteneur et
    # rend la main avant que uvicorn n'ecoute : la gateway repond alors 502 le
    # temps que le modele spaCy se charge (~4 s).
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request;urllib.request.urlopen("http://localhost:8000/api/v1/livez").read()',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend_ai_worker:
    image: ghcr.io/plic-mti-highfive/highfive-backend-ai-worker:${AI_VERSION:-latest}
    container_name: highfive_backend_ai_worker
    restart: unless-stopped
    environment:
      DATABASE_URI : postgresql+asyncpg://${POSTGRES_USER:-postgresadmin}:${POSTGRES_PASSWORD:-postgresadmin}@db:5432/highfive
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET : ${JWT_SECRET:-clee-super-secret}
      OPENAI_API_KEY : ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend_ai_migrate:
        condition: service_completed_successfully

  # 6bis. SEED — jeu de demonstration, rejoue par l'API a chaque demarrage.
  # Idempotent (voir core_backend/scripts/seed.mjs) : sans effet si les
  # comptes/projets de demo existent deja, donc pas besoin de le lancer a la
  # main apres un `make up`/`make local`.
  seed:
    image: ghcr.io/plic-mti-highfive/highfive-backend-core:${CORE_VERSION:-latest}
    container_name: highfive_seed
    restart: "no"
    command: ["node", "scripts/seed.mjs"]
    environment:
      API_URL: http://backend_core:3000
    depends_on:
      backend_core:
        condition: service_healthy

  # 6. DATABASE
  db:
    image: pgvector/pgvector:pg16
    container_name: highfive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER : ${POSTGRES_USER:-postgresadmin}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD:-postgresadmin}
      POSTGRES_DB : highfive
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgresadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: highfive_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: highfive_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"   # API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
server {
    listen 52;
    server_name localhost;

    # 1. Websocket Routing
    location /ws/ {
        proxy_pass http://backend_canvas:8585; 
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 2. API Routing
    location /api/ {
        # Sans slash final : le prefixe /api/ est conserve. Le core v2 sert
        # toutes ses routes sous /api (setGlobalPrefix), contrairement a la v1
        # qui servait a la racine.
        proxy_pass http://backend_core:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        proxy_pass http://backend_ai_api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Frontend Routing
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }
}

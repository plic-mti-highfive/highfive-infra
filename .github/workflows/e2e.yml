name: e2e

# Lance la stack complete (build depuis les 5 depots, LLM_PROVIDER=fake) puis
# les tests Playwright. Stack jetable : projet compose unique par run, supprime
# (conteneurs + volumes) a la fin meme en echec.
#
# Declencheurs :
#  - workflow_call : appele par chaque depot au push sur main (voir README, section
#    "CI e2e") ; le depot appelant passe son `github.sha` dans son <depot>_ref.
#  - workflow_dispatch : lancement manuel, refs libres (defaut main).
#  - push sur main du depot infra.
on:
  workflow_call:
    inputs:
      frontend_ref:
        description: Branche, tag ou SHA du depot highfive-frontend
        type: string
        default: main
      core_ref:
        description: Branche, tag ou SHA du depot highfive-backend-core
        type: string
        default: main
      canvas_ref:
        description: Branche, tag ou SHA du depot highfive-backend-canvas
        type: string
        default: main
      ai_ref:
        description: Branche, tag ou SHA du depot highfive-backend-ai
        type: string
        default: main
      infra_ref:
        description: Branche, tag ou SHA du depot highfive-infra
        type: string
        default: main
    secrets:
      REPOS_TOKEN:
        description: PAT fine-grained, lecture du contenu des 5 depots
        required: true
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Branche, tag ou SHA du depot highfive-frontend
        type: string
        default: main
      core_ref:
        description: Branche, tag ou SHA du depot highfive-backend-core
        type: string
        default: main
      canvas_ref:
        description: Branche, tag ou SHA du depot highfive-backend-canvas
        type: string
        default: main
      ai_ref:
        description: Branche, tag ou SHA du depot highfive-backend-ai
        type: string
        default: main
      infra_ref:
        description: Branche, tag ou SHA du depot highfive-infra
        type: string
        default: main
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Dans un workflow reutilisable, `github` est le contexte du depot appelant :
  # un groupe par depot + ref, sans annuler les runs de main deja en cours.
  group: e2e-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ORG: plic-mti-highfive
  GATEWAY_PORT: '52'
  DB_HOST_PORT: '5432'
  # Stack jetable propre a ce run (aucune collision entre runs sur un meme runner).
  COMPOSE_PROJECT_NAME: e2e-${{ github.run_id }}-${{ github.run_attempt }}
  POSTGRES_USER: postgresadmin
  POSTGRES_PASSWORD: postgresadmin
  LLM_PROVIDER: fake

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Les depots sont prives : REPOS_TOKEN = PAT avec lecture sur les 5 depots.
      # Sans `repository`, actions/checkout prendrait le depot APPELANT (cas
      # workflow_call) : tous les checkouts sont donc explicites.
      # Infra : si on tourne dans le depot infra sur push, on teste
      # exactement le commit declencheur ; sinon (appel d'un autre depot ou
      # dispatch) on prend infra_ref (defaut main).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/highfive-infra
          ref: ${{ (github.repository == format('{0}/highfive-infra', env.ORG) && github.event_name == 'push') && github.sha || inputs.infra_ref || 'main' }}
          token: ${{ secrets.REPOS_TOKEN }}
          path: highfive-infra
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/highfive-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          token: ${{ secrets.REPOS_TOKEN }}
          path: highfive-frontend
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/highfive-backend-core
          ref: ${{ inputs.core_ref || 'main' }}
          token: ${{ secrets.REPOS_TOKEN }}
          path: highfive-backend-core
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/highfive-backend-canvas
          ref: ${{ inputs.canvas_ref || 'main' }}
          token: ${{ secrets.REPOS_TOKEN }}
          path: highfive-backend-canvas
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/highfive-backend-ai
          ref: ${{ inputs.ai_ref || 'main' }}
          token: ${{ secrets.REPOS_TOKEN }}
          path: highfive-backend-ai

      - name: Demarrer la stack
        working-directory: highfive-infra
        run: |
          cp .env.example .env
          {
            echo "REPOS_DIR=$GITHUB_WORKSPACE"
            echo "LLM_PROVIDER=fake"
            echo "POSTGRES_USER=$POSTGRES_USER"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
          } >> .env
          docker compose up -d --build --wait
          docker compose --profile seed up seed

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: highfive-infra/e2e/pnpm-lock.yaml

      - name: Installer les dependances e2e
        working-directory: highfive-infra/e2e
        run: pnpm install --frozen-lockfile

      - name: Playwright
        working-directory: highfive-infra/e2e
        run: pnpm test:e2e

      - name: Logs de la stack (echec)
        if: failure()
        working-directory: highfive-infra
        run: docker compose logs --no-color > stack.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            highfive-infra/e2e/playwright-report
            highfive-infra/e2e/test-results
            highfive-infra/stack.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Arreter la stack
        if: always()
        working-directory: highfive-infra
        run: docker compose --profile seed down -v --remove-orphans
